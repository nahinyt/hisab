# Hisab: Node (internal) + Caddy (one published port).
#
# Host publish port comes from project `.env` (Compose interpolation):
#   PORT=61961
#   PUBLIC_ORIGIN=http://127.0.0.1:61961
#
#   cp worker/.env.example worker/.env   # app secrets
#   echo "PORT=8080" > .env              # host port (or your assigned port)
#   docker compose up -d --build
#
# Only Caddy is published. Node stays on the Compose network at :8787.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: worker/.env
        required: false
    environment:
      HOST: "0.0.0.0"
      # Internal listen port (do not publish). Host port is PORT in project .env.
      PORT: "8787"
      TRUST_PROXY: "1"
      HISAB_DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:${PORT:-8080}}
    volumes:
      - hisab-data:/data
    expose:
      - "8787"
    networks:
      - hisab

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - hisab

volumes:
  hisab-data:

networks:
  hisab:
