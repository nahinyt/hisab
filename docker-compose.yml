# Hisab: Node (internal) + Caddy (one published port).
#
#   cp worker/.env.example worker/.env   # edit secrets
#   docker compose up -d --build
#   open http://127.0.0.1:8080
#
# Only Caddy is published. Node stays on the Compose network.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: worker/.env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      TRUST_PROXY: "1"
      HISAB_DATA_DIR: /data
      # Browser origin through the published Caddy port (override in worker/.env for a real domain)
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
    volumes:
      - hisab-data:/data
    expose:
      - "8787"
    networks:
      - hisab

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HISAB_PORT:-8080}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - hisab

volumes:
  hisab-data:

networks:
  hisab:
